<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP CS Arcade</title>
  <meta name="description" content="AP CS Arcade: four games built by an AP Computer Science class. Play BetLife in your browser.">
  <link rel="stylesheet" href="styles/arcade.css">
</head>
<body>
  <main class="home">
    <header class="home-header">
      <h1 class="home-title">AP CS ARCADE</h1>
      <p class="home-subtitle">4 Games. One Arcade.</p>
    </header>
    <section class="game-grid" id="game-grid" aria-label="Games">
      <p class="grid-loading">Loading games…</p>
    </section>
    <footer class="home-footer">An AP Computer Science class project · <a href="https://github.com/Donati157/AP-CS-Arcade">Source on GitHub</a></footer>
  </main>
  <script type="module" src="scripts/arcade.js"></script>
  <script>
    // Arriving at the arcade ends every game's session. Each game shell sets a marker when it is
    // entered; clearing them here means the next entry starts that game from its first screen.
    try {
      for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const key = sessionStorage.key(i);
        if (key && key.startsWith('arcade.session.')) sessionStorage.removeItem(key);
      }
    } catch (error) { /* private mode */ }
  </script>
</body>
</html>
